<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>白菜聊天室 - 私聊</title>
    <link rel="icon" href="baicai.svg" type="image/svg+xml">

    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://static.geetest.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://static.geetest.com" crossorigin>

    <script src="baicaisupabase.js"></script>
    <script src="supabase.min.js"></script>
    <link rel="stylesheet" href="style.css">

    <style>
        /* ========== 私聊专用样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #e8ecf1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .app-container {
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            max-height: 800px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== 顶部栏 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid #f0f2f5;
            flex-shrink: 0;
            background: #ffffff;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left .back-btn {
            background: none;
            border: none;
            color: #4a6cf7;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .header-left .back-btn:hover {
            background: #f0f2f5;
        }

        .header-left .chat-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a1a2e;
        }

        .header-left .chat-subtitle {
            font-size: 0.75rem;
            color: #8a8a9e;
            margin-left: 8px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-right .logout-btn {
            background: #f0f2f5;
            border: 1px solid #e2e5ea;
            color: #e74c3c;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.78rem;
            transition: all 0.2s;
        }

        .header-right .logout-btn:hover {
            background: #fde8e8;
            border-color: #f5c6c6;
        }

        .header-right .user-badge {
            background: #f0f2f5;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #2d2d3f;
        }

        /* ===== 主体布局 ===== */
        .chat-layout {
            display: flex;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        /* ===== 在线列表 ===== */
        .online-sidebar {
            width: 240px;
            flex-shrink: 0;
            background: #f8f9fb;
            padding: 16px 14px;
            border-right: 1px solid #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .online-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid #f0f2f5;
            font-size: 0.9rem;
            font-weight: 600;
            color: #2d2d3f;
            flex-shrink: 0;
        }

        .online-title .count-badge {
            font-size: 0.7rem;
            background: #e8eaed;
            color: #5a5a6e;
            padding: 1px 10px;
            border-radius: 40px;
        }

        .online-list-wrap {
            flex: 1;
            overflow-y: auto;
            margin-top: 8px;
            min-height: 0;
        }

        .online-list {
            list-style: none;
        }

        .online-item {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            border-radius: 8px;
            gap: 10px;
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 1px solid #f0f2f5;
        }

        .online-item:hover {
            background: #f0f2f5;
        }

        .online-item.active {
            background: rgba(74,108,247,0.12);
        }

        .online-item .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .online-item .status-dot.online {
            background: #4ade80;
            box-shadow: 0 0 0 2px rgba(74,222,128,0.15);
        }

        .online-item .status-dot.offline {
            background: #c5cbd5;
        }

        .online-item .username {
            flex: 1;
            font-weight: 500;
            font-size: 0.82rem;
            color: #2d2d3f;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .online-item .user-ip {
            font-size: 0.55rem;
            color: #b0b8c5;
            background: #f0f2f5;
            padding: 1px 8px;
            border-radius: 40px;
            flex-shrink: 0;
        }

        .online-item .chat-indicator {
            font-size: 0.7rem;
            color: #4a6cf7;
            display: none;
        }

        .online-item.active .chat-indicator {
            display: inline;
        }

        /* ===== 消息区域 ===== */
        .chat-main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: #fafbfc;
            min-height: 0;
        }

        /* ===== 私聊提示 ===== */
        .private-banner {
            background: #e8f0fe;
            color: #1a3a6a;
            padding: 6px 16px;
            font-size: 0.82rem;
            text-align: center;
            border-bottom: 1px solid #d0dce8;
            flex-shrink: 0;
            display: none;
        }

        .private-banner.show {
            display: block;
        }

        /* ===== 消息列表 ===== */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 0;
        }

        .messages .message {
            max-width: 75%;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 0.88rem;
            line-height: 1.6;
            word-wrap: break-word;
            background: #ffffff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            align-self: flex-start;
            animation: fadeIn 0.2s ease;
        }

        .messages .message.own {
            background: #e8f4fd;
            align-self: flex-end;
            border-radius: 10px 10px 4px 10px;
        }

        .messages .message .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: #8a8a9e;
            margin-bottom: 2px;
            gap: 8px;
        }

        .messages .message .msg-author {
            font-weight: 600;
            color: #4a6cf7;
        }

        .messages .message .msg-time {
            color: #b0b8c5;
            font-size: 0.65rem;
        }

        .messages .message .msg-content {
            word-break: break-word;
        }

        .messages .message .private-tag {
            font-size: 0.55rem;
            color: #4a6cf7;
            background: #e8eaed;
            padding: 0 8px;
            border-radius: 40px;
            margin-left: 6px;
        }

        .messages .empty-message {
            text-align: center;
            color: #b0b8c5;
            padding: 40px 0;
            font-size: 0.9rem;
        }

        .messages .empty-message span {
            display: block;
            font-size: 0.75rem;
            margin-top: 4px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== 输入区域 ===== */
        .input-area {
            display: flex;
            gap: 10px;
            padding: 12px 20px 16px;
            background: #ffffff;
            border-top: 1px solid #f0f2f5;
            flex-shrink: 0;
        }

        .input-area input {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid #e2e5ea;
            border-radius: 12px;
            font-size: 0.9rem;
            outline: none;
            background: #fafbfc;
            transition: border-color 0.2s;
            min-width: 0;
        }

        .input-area input:focus {
            border-color: #4a6cf7;
        }

        .input-area .btn {
            padding: 10px 24px;
            background: #4a6cf7;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .input-area .btn:hover {
            background: #3a5cd9;
        }

        .input-area .btn:disabled {
            background: #b0b8c5;
            cursor: not-allowed;
        }

        /* ===== 底部 ===== */
        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 20px;
            border-top: 1px solid #f0f2f5;
            font-size: 0.7rem;
            color: #b0b8c5;
            flex-shrink: 0;
            background: #ffffff;
        }

        .footer-bar .school-info {
            font-weight: 600;
            color: #2d2d3f;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .online-sidebar {
                width: 48px;
                min-width: 48px;
                padding: 12px 6px;
            }

            .online-sidebar .online-title span:not(.count-badge) {
                display: none;
            }

            .online-sidebar .online-item {
                padding: 8px 4px;
                justify-content: center;
            }

            .online-sidebar .online-item .username,
            .online-sidebar .online-item .user-ip,
            .online-sidebar .online-item .chat-indicator {
                display: none;
            }

            .messages .message {
                max-width: 90%;
                font-size: 0.82rem;
                padding: 8px 12px;
            }

            .header .header-left .chat-subtitle {
                display: none;
            }

            .input-area {
                padding: 10px 14px 14px;
                flex-wrap: wrap;
            }

            .input-area input {
                min-width: 100%;
                font-size: 16px;
            }

            .input-area .btn {
                width: 100%;
                padding: 12px 0;
            }

            .app-container {
                max-height: 100vh;
                border-radius: 0;
            }
        }

        @media (max-width: 480px) {
            .messages {
                padding: 12px 14px;
            }

            .messages .message {
                max-width: 92%;
                font-size: 0.8rem;
                padding: 8px 12px;
            }

            .header {
                padding: 10px 14px;
            }

            .header .header-left .chat-title {
                font-size: 0.95rem;
            }

            .header-right .user-badge {
                display: none;
            }
        }

        /* ===== 登录卡片（复用原样式） ===== */
        .login-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.05);
            padding: 32px 28px;
            width: 100%;
            max-width: 420px;
            margin: auto;
            border: 1px solid rgba(0,0,0,0.04);
            position: relative;
        }

        .login-card h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 24px;
            text-align: center;
            letter-spacing: -0.3px;
        }

        .login-card .subtitle {
            text-align: center;
            color: #8a8a9e;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .login-card .form-group {
            margin-bottom: 16px;
        }

        .login-card .form-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            color: #2d2d3f;
            font-size: 0.82rem;
        }

        .login-card .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e5ea;
            border-radius: 12px;
            font-size: 0.9rem;
            background: #fafbfc;
            outline: none;
            transition: border-color 0.2s;
        }

        .login-card .form-group input:focus {
            border-color: #4a6cf7;
        }

        .login-card .btn {
            width: 100%;
            padding: 12px 0;
            background: #4a6cf7;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .login-card .btn:hover {
            background: #3a5cd9;
        }

        .login-card .btn:disabled {
            background: #b0b8c5;
            cursor: not-allowed;
        }

        .login-card .error {
            color: #e74c3c;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 4px;
            display: none;
        }

        .login-card .login-footer {
            text-align: center;
            color: #8a8a9e;
            font-size: 0.78rem;
            margin-top: 14px;
        }

        .login-card .ip-badge {
            background: #f0f2f5;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.7rem;
            color: #4a4a5a;
            text-align: center;
            margin-bottom: 16px;
            word-break: break-all;
        }

        .login-card .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0 12px;
        }

        .login-card .remember-me label {
            font-size: 0.8rem;
            color: #5a5a6e;
            cursor: pointer;
        }

        .login-card .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #4a6cf7;
            cursor: pointer;
        }

        /* ===== IP屏蔽 ===== */
        .ip-block-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .ip-block-overlay.active {
            display: flex;
        }

        .ip-block-box {
            background: #ffffff;
            border-radius: 24px;
            padding: 32px 28px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
        }

        .ip-block-box h2 {
            font-size: 1.3rem;
            color: #1a1a2e;
            margin-bottom: 4px;
        }

        .ip-block-box p {
            font-size: 0.88rem;
            color: #5a5a6e;
            line-height: 1.6;
        }

        .ip-block-box .ip-info {
            background: #f5f6f8;
            border-radius: 12px;
            padding: 12px 16px;
            margin: 14px 0;
            font-family: monospace;
            font-size: 0.85rem;
            color: #2d2d3f;
            word-break: break-all;
        }

        .ip-block-box .btn-close-block {
            background: #4a6cf7;
            color: #fff;
            border: none;
            padding: 10px 32px;
            border-radius: 40px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 600;
        }

        .ip-block-box .support-text {
            font-size: 0.75rem;
            color: #b0b8c5;
            margin-top: 10px;
        }

        #loginPanel {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        #chatPanel {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .app-container {
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>

<!-- ===== IP屏蔽 ===== -->
<div class="ip-block-overlay" id="ipBlockOverlay">
    <div class="ip-block-box">
        <h2>访问受限</h2>
        <p>该聊天室仅限<strong>中国大陆地区</strong>用户访问</p>
        <p style="font-size:0.8rem;color:#8a8a9e;margin-top:2px;">本聊天室仅限中国大陆地区使用，不含港澳台。</p>
        <div class="ip-info">
            IP：<span id="blockedIpDisplay">加载中...</span><br>
            归属地：<span id="blockedLocationDisplay">加载中...</span>
        </div>
        <button class="btn-close-block" onclick="location.reload()">重新检测</button>
        <p class="support-text">如有异议，请联系管理员</p>
    </div>
</div>

<!-- ===== 主容器 ===== -->
<div class="app-container" id="app">

    <!-- ===== 登录面板 ===== -->
    <div id="loginPanel">
        <div class="login-card">
            <h2>白菜聊天室</h2>
            <p class="subtitle">私聊 · 安全 · 即时</p>
            <div class="ip-badge" id="ipDisplay">IP获取中...</div>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" placeholder="输入你的名字" maxlength="6">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="输入密码" maxlength="12">
            </div>
            <div id="captcha-container"></div>
            <div class="captcha-reset-hint" id="captchaResetHint"></div>
            <div class="remember-me">
                <input type="checkbox" id="rememberMe" checked>
                <label for="rememberMe">记住我</label>
            </div>
            <div id="loginError" class="error"></div>
            <button class="btn" id="enterBtn" disabled>进入聊天室</button>
            <div class="login-footer">已有账号自动登录，新账号自动注册</div>
        </div>
    </div>

    <!-- ===== 聊天面板 ===== -->
    <div id="chatPanel">
        <!-- 顶部栏 -->
        <div class="header">
            <div class="header-left">
                <button class="back-btn" id="backBtn" title="返回主聊天室">←</button>
                <span class="chat-title" id="chatTitle">群聊</span>
                <span class="chat-subtitle" id="chatSubtitle">所有人在线</span>
            </div>
            <div class="header-right">
                <span class="user-badge" id="userBadge">加载中...</span>
                <button class="logout-btn" id="logoutBtn">退出</button>
            </div>
        </div>

        <!-- 私聊提示条 -->
        <div class="private-banner" id="privateBanner">
            💬 正在与 <strong id="privateTargetName">用户</strong> 私聊
            <button id="closePrivateBtn" style="background:none;border:none;color:#4a6cf7;cursor:pointer;font-weight:600;margin-left:8px;">退出</button>
        </div>

        <!-- 主体 -->
        <div class="chat-layout">
            <!-- 消息区域 -->
            <div class="chat-main">
                <div class="messages" id="messageList">
                    <div class="empty-message">加载中...</div>
                </div>
                <div class="input-area">
                    <input type="text" id="messageInput" placeholder="输入消息..." maxlength="200">
                    <button class="btn" id="sendBtn">发送</button>
                </div>
            </div>

            <!-- 在线列表 -->
            <div class="online-sidebar">
                <div class="online-title">
                    <span>在线</span>
                    <span class="count-badge" id="onlineCount">0</span>
                </div>
                <div class="online-list-wrap">
                    <ul class="online-list" id="onlineList">
                        <li style="color:#b0b8c5;text-align:center;padding:16px 0;font-size:0.8rem;">加载中...</li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- 底部 -->
        <div class="footer-bar">
            <span></span>
            <span class="school-info">白菜聊天室 · 私聊版</span>
            <span></span>
        </div>
    </div>
</div>

<!-- ===== 依赖 ===== -->
<script src="baicaisupabase.js"></script>
<script src="supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
<script src="https://static.geetest.com/v4/gt4.js"></script>
<script src="bcyz.js"></script>

<!-- ===== 主逻辑 ===== -->
<script>
    (function() {
        'use strict';

        // ================================================================
        // 1. 状态
        // ================================================================
        var currentUser = null;
        var currentChat = { type: 'public', userId: null, username: null };
        var onlineUsers = [];
        var messageInterval = null;
        var isCaptchaVerified = false;

        // ================================================================
        // 2. DOM
        // ================================================================
        var loginPanel = document.getElementById('loginPanel');
        var chatPanel = document.getElementById('chatPanel');
        var usernameInput = document.getElementById('username');
        var passwordInput = document.getElementById('password');
        var enterBtn = document.getElementById('enterBtn');
        var loginError = document.getElementById('loginError');
        var messageList = document.getElementById('messageList');
        var messageInput = document.getElementById('messageInput');
        var sendBtn = document.getElementById('sendBtn');
        var onlineList = document.getElementById('onlineList');
        var onlineCount = document.getElementById('onlineCount');
        var userBadge = document.getElementById('userBadge');
        var logoutBtn = document.getElementById('logoutBtn');
        var backBtn = document.getElementById('backBtn');
        var chatTitle = document.getElementById('chatTitle');
        var chatSubtitle = document.getElementById('chatSubtitle');
        var privateBanner = document.getElementById('privateBanner');
        var privateTargetName = document.getElementById('privateTargetName');
        var closePrivateBtn = document.getElementById('closePrivateBtn');
        var ipDisplay = document.getElementById('ipDisplay');

        // ================================================================
        // 3. 登录
        // ================================================================
        function handleLogin() {
            var username = usernameInput.value.trim();
            var password = passwordInput.value.trim();

            if (!username || !password) {
                loginError.textContent = '请输入用户名和密码';
                loginError.style.display = 'block';
                return;
            }

            if (!isCaptchaVerified) {
                loginError.textContent = '请先完成验证码验证';
                loginError.style.display = 'block';
                return;
            }

            loginError.style.display = 'none';
            enterBtn.disabled = true;
            enterBtn.textContent = '登录中...';

            // 这里调用你原有的登录逻辑
            // 由于你已经有了 baicaisupabase.js，这里假设它提供了登录方法
            // 如果登录成功，调用 onLoginSuccess
            // 为了演示，用 setTimeout 模拟
            setTimeout(function() {
                // 模拟登录成功
                currentUser = {
                    id: 'user_' + Date.now(),
                    username: username
                };
                onLoginSuccess();
            }, 500);
        }

        function onLoginSuccess() {
            loginPanel.style.display = 'none';
            chatPanel.style.display = 'flex';
            userBadge.textContent = currentUser.username;
            enterBtn.disabled = false;
            enterBtn.textContent = '进入聊天室';
            loadOnlineUsers();
            loadMessages();
            startPolling();
        }

        // ================================================================
        // 4. 消息
        // ================================================================
        function loadMessages() {
            var query = supabase
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true });

            if (currentChat.type === 'private') {
                query = query
                    .or('user_id.eq.' + currentUser.id + ',receiver_id.eq.' + currentUser.id);
            }

            query.limit(200).then(function(response) {
                if (response.error) throw response.error;
                var data = response.data || [];
                var filtered = data;

                if (currentChat.type === 'private') {
                    filtered = data.filter(function(msg) {
                        var isSender = msg.user_id === currentUser.id && msg.receiver_id === currentChat.userId;
                        var isReceiver = msg.user_id === currentChat.userId && msg.receiver_id === currentUser.id;
                        return isSender || isReceiver;
                    });
                } else {
                    filtered = data.filter(function(msg) {
                        return !msg.receiver_id;
                    });
                }

                renderMessages(filtered);
            }).catch(function(error) {
                console.error('加载消息失败:', error);
            });
        }

        function renderMessages(messages) {
            messageList.innerHTML = '';
            if (!messages || messages.length === 0) {
                messageList.innerHTML = '<div class="empty-message">暂无消息<br><span>开始聊天吧</span></div>';
                return;
            }

            messages.forEach(function(msg) {
                var div = document.createElement('div');
                div.className = 'message';
                var isOwn = msg.user_id === currentUser.id;

                var time = new Date(msg.created_at);
                var timeStr = time.toLocaleString('zh-CN');

                var authorName = msg.username || msg.user_id;
                if (isOwn) authorName = '我';

                var privateTag = msg.receiver_id ? '<span class="private-tag">私聊</span>' : '';

                div.innerHTML = `
                    <div class="msg-header">
                        <span class="msg-author">${authorName} ${privateTag}</span>
                        <span class="msg-time">${timeStr}</span>
                    </div>
                    <div class="msg-content">${msg.content}</div>
                `;

                if (isOwn) {
                    div.classList.add('own');
                }

                messageList.appendChild(div);
            });

            scrollToBottom();
        }

        function sendMessage() {
            var text = messageInput.value.trim();
            if (!text) return;

            sendBtn.disabled = true;
            messageInput.disabled = true;

            var payload = {
                content: text,
                user_id: currentUser.id,
                username: currentUser.username,
                created_at: new Date().toISOString()
            };

            if (currentChat.type === 'private') {
                payload.receiver_id = currentChat.userId;
            }

            supabase.from('messages').insert([payload]).select().then(function(response) {
                messageInput.disabled = false;
                sendBtn.disabled = false;
                messageInput.value = '';
                messageInput.focus();

                if (response.error) throw response.error;
                loadMessages();
            }).catch(function(error) {
                messageInput.disabled = false;
                sendBtn.disabled = false;
                console.error('发送失败:', error);
                loginError.textContent = '发送失败: ' + error.message;
                loginError.style.display = 'block';
            });
        }

        function scrollToBottom() {
            setTimeout(function() {
                messageList.scrollTop = messageList.scrollHeight;
            }, 50);
        }

        // ================================================================
        // 5. 在线用户
        // ================================================================
        function loadOnlineUsers() {
            supabase.from('online_users').select('*').then(function(response) {
                if (response.error) throw response.error;
                onlineUsers = response.data || [];
                renderOnlineUsers();
            }).catch(function(error) {
                console.error('加载在线用户失败:', error);
            });
        }

        function renderOnlineUsers() {
            onlineList.innerHTML = '';
            var count = 0;

            onlineUsers.forEach(function(user) {
                if (user.id === currentUser.id) return;
                count++;

                var li = document.createElement('li');
                li.className = 'online-item';
                li.dataset.userId = user.id;
                li.dataset.username = user.username;

                var isActive = currentChat.type === 'private' && currentChat.userId === user.id;

                li.innerHTML = `
                    <span class="status-dot online"></span>
                    <span class="username">${user.username}</span>
                    <span class="user-ip">${user.ip || ''}</span>
                    <span class="chat-indicator">${isActive ? '💬' : ''}</span>
                `;

                li.addEventListener('click', function() {
                    startPrivateChat(user.id, user.username);
                });

                if (isActive) li.classList.add('active');
                onlineList.appendChild(li);
            });

            // 更新在线人数
            onlineCount.textContent = count;
        }

        // ================================================================
        // 6. 私聊
        // ================================================================
        function startPrivateChat(userId, username) {
            if (userId === currentUser.id) {
                alert('不能和自己私聊');
                return;
            }

            currentChat = { type: 'private', userId: userId, username: username };
            privateBanner.classList.add('show');
            privateTargetName.textContent = username;
            chatTitle.textContent = '私聊';
            chatSubtitle.textContent = '与 ' + username;

            // 高亮在线列表
            document.querySelectorAll('.online-item').forEach(function(item) {
                item.classList.remove('active');
                var indicator = item.querySelector('.chat-indicator');
                if (indicator) indicator.textContent = '';
                if (item.dataset.userId === userId) {
                    item.classList.add('active');
                    if (indicator) indicator.textContent = '💬';
                }
            });

            loadMessages();
            messageInput.focus();
        }

        function closePrivateChat() {
            currentChat = { type: 'public', userId: null, username: null };
            privateBanner.classList.remove('show');
            chatTitle.textContent = '群聊';
            chatSubtitle.textContent = '所有人在线';

            document.querySelectorAll('.online-item').forEach(function(item) {
                item.classList.remove('active');
                var indicator = item.querySelector('.chat-indicator');
                if (indicator) indicator.textContent = '';
            });

            loadMessages();
        }

        // ================================================================
        // 7. 轮询
        // ================================================================
        function startPolling() {
            if (messageInterval) clearInterval(messageInterval);
            messageInterval = setInterval(function() {
                loadMessages();
                loadOnlineUsers();
            }, 3000);
        }

        // ================================================================
        // 8. 登出
        // ================================================================
        function logout() {
            if (messageInterval) clearInterval(messageInterval);
            currentUser = null;
            chatPanel.style.display = 'none';
            loginPanel.style.display = 'flex';
            loginError.textContent = '已退出';
            loginError.style.display = 'block';
            setTimeout(function() {
                loginError.style.display = 'none';
            }, 2000);
        }

        // ================================================================
        // 9. 返回主聊天室
        // ================================================================
        function goBack() {
            window.location.href = 'index.html';
        }

        // ================================================================
        // 10. 事件绑定
        // ================================================================
        enterBtn.addEventListener('click', handleLogin);

        usernameInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') passwordInput.focus();
        });

        passwordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') enterBtn.click();
        });

        sendBtn.addEventListener('click', sendMessage);

        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        logoutBtn.addEventListener('click', logout);
        backBtn.addEventListener('click', goBack);
        closePrivateBtn.addEventListener('click', closePrivateChat);

        // ================================================================
        // 11. IP
        // ================================================================
        // 加载IP显示
        fetch('https://api.ip.sb/geoip')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                ipDisplay.textContent = data.ip + ' (' + (data.country || '未知') + ')';
            })
            .catch(function() {
                ipDisplay.textContent = '获取IP失败';
            });

        // ================================================================
        // 12. 初始化
        // ================================================================
        console.log('私聊聊天室已加载');
        loginPanel.style.display = 'flex';
        chatPanel.style.display = 'none';

        // 暴露 supabase 给浏览器
        window.__supabase = supabase;

    })();
</script>

</body>
</html>
