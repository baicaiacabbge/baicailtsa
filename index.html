<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>白菜聊天室</title>
    <link rel="icon" href="baicai.svg" type="image/svg+xml">

    <!-- ========== DNS 预解析 ========== -->
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://static.geetest.com">

    <!-- ========== 预连接 ========== -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://static.geetest.com" crossorigin>

    <script src="baicaisupabase.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
    <script src="supabase.min.js"></script>
    <script src="https://static.geetest.com/v4/gt4.js"></script>
    <script src="bcyz.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ip-block-overlay" id="ipBlockOverlay">
    <div class="ip-block-box">
        <div class="lock-icon">❌️</div>
        <h2>访问受限</h2>
        <p>该聊天室仅限<strong>中国大陆地区</strong>用户访问</p>
        <p style="font-size:0.8rem;color:#8a8a9e;margin-top:2px;">本聊天室仅限中国大陆地区使用，不含港澳台。</p>
        <div class="ip-info">
            IP：<span id="blockedIpDisplay">加载中...</span><br>
            归属地：<span id="blockedLocationDisplay">加载中...</span>
        </div>
        <button class="btn-close-block" onclick="location.reload()">重新检测</button>
        <p class="support-text">如有异议，请联系管理员</p>
    </div>
</div>

<div class="app-container" id="app">
    <!-- 登录卡片 -->
    <div id="loginPanel" class="login-card">
        <span class="auto-login-badge" id="autoLoginBadge" style="display:none;">自动登录</span>
        <h2>白菜聊天室</h2>
        <div class="ip-badge" id="ipDisplay">IP获取中...</div>
        <div class="form-group">
            <label>用户名 (1-6个汉字)</label>
            <input type="text" id="username" placeholder="输入你的名字" maxlength="6">
        </div>
        <div class="form-group">
            <label>密码 (8-12位，含数字/字母/特殊字符)</label>
            <input type="password" id="password" placeholder="输入密码" maxlength="12">
        </div>
        <!-- 极验验证码 -->
        <div id="captcha-container"></div>
        <div class="captcha-reset-hint" id="captchaResetHint"></div>
        <div class="remember-me">
            <input type="checkbox" id="rememberMe" checked>
            <label for="rememberMe">记住我</label>
        </div>
        <div id="loginError" class="error"></div>
        <button class="btn" id="enterBtn" disabled>进入聊天室</button>
        <div class="login-footer">已有账号直接登录，新账号自动注册</div>
    </div>

    <!-- 聊天主面板 -->
    <div id="chatPanel" style="display: none; width: 100%; flex: 1; flex-direction: column;">
        <div class="chat-layout" style="flex:1;min-height:0;">
            <!-- 聊天主区域 -->
            <div class="chat-main" style="flex:1;min-width:0;background:#ffffff;border-radius:24px;box-shadow:0 4px 24px rgba(0,0,0,0.04);overflow:hidden;display:flex;flex-direction:column;border:1px solid rgba(0,0,0,0.04);min-height:0;">
                <div class="chat-header" style="padding:14px 20px;border-bottom:1px solid #f0f2f5;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;flex-shrink:0;">
                    <span class="user-badge" id="userInfo" style="background:#f0f2f5;color:#2d2d3f;padding:4px 14px;border-radius:40px;font-size:0.8rem;font-weight:500;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">加载中...</span>
                    <button class="logout-btn" id="logoutBtn" style="background:#f0f2f5;border:1px solid #e2e5ea;color:#e74c3c;padding:6px 16px;border-radius:40px;font-weight:500;cursor:pointer;transition:all 0.2s;font-size:0.78rem;">退出登录</button>
                </div>
                <div id="warningMessage" class="warning" style="background:#fef3e2;color:#b45309;padding:10px 16px;margin:0 16px 12px 16px;border-radius:12px;font-size:0.85rem;display:none;border:1px solid #fde68a;"></div>
                <!-- 关键：messages 用 flex:1 撑满 -->
                <div class="messages" id="messageList" style="flex:1;min-height:0;padding:14px 18px;overflow-y:auto;background:#fafbfc;border-radius:16px;margin:12px 16px;border:1px solid #f0f2f5;"></div>
                <div class="input-area" style="display:flex;gap:8px;padding:0 16px 16px 16px;flex-shrink:0;">
                    <input type="text" id="messageInput" placeholder="输入消息..." maxlength="200" style="flex:1;padding:12px 16px;border:2px solid #e2e5ea;border-radius:12px;font-size:0.9rem;background:#fafbfc;outline:none;transition:all 0.2s;min-width:0;">
                    <button class="btn" id="sendBtn" style="background:#4a6cf7;color:white;border:none;padding:12px 24px;border-radius:12px;font-size:0.95rem;font-weight:600;cursor:pointer;width:auto;transition:all 0.2s;box-shadow:0 4px 16px rgba(74,108,247,0.2);flex-shrink:0;">发送</button>
                </div>
                <div class="char-count" id="charCount" style="padding:0 16px 8px 16px;font-size:0.7rem;color:#b0b8c5;text-align:right;flex-shrink:0;">0/200</div>
            </div>

            <!-- 在线列表 -->
            <div class="online-sidebar" style="width:240px;flex-shrink:0;background:#f8f9fb;border-radius:24px;padding:16px 14px;border:1px solid rgba(0,0,0,0.04);display:flex;flex-direction:column;max-height:500px;">
                <div class="online-title" style="font-size:0.9rem;font-weight:600;color:#2d2d3f;display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid #f0f2f5;flex-shrink:0;">
                    <span> 在线</span>
                    <span class="count-badge" id="onlineCount" style="font-size:0.7rem;background:#e8eaed;color:#5a5a6e;padding:1px 10px;border-radius:40px;">0 在线</span>
                </div>
                <div class="online-list-wrap" style="flex:1;overflow-y:auto;margin-top:8px;">
                    <ul class="online-list" id="onlineList" style="list-style:none;">
                        <li style="color: #b0b8c5; text-align: center; padding: 16px 0; font-size:0.8rem;">加载中...</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="footer-bar" style="background:#f8f9fb;border-radius:60px;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;border:1px solid #f0f2f5;margin-top:6px;flex-shrink:0;">
            <span></span>
            <span class="school-info" style="font-size:0.85rem;font-weight:600;color:#2d2d3f;text-align:center;flex:1;">白菜聊天室</span>
            <div style="display: flex; gap: 8px;">
                <span class="bulletin-btn" id="viewBulletinBtn" style="background:#f0f2f5;border:1px solid #e2e5ea;color:#4a4a5a;padding:6px 16px;border-radius:40px;font-weight:500;cursor:pointer;transition:all 0.2s;font-size:0.78rem;">公告</span>
            </div>
        </div>
    </div>
</div>

<!-- 公告弹窗 -->
<div class="modal" id="bulletinModal">
    <div class="modal-content">
        <h3>公告</h3>
        <p id="bulletinContent">加载中...</p>
        <div class="close-modal">
            <button id="closeModalBtn">关闭</button>
        </div>
    </div>
</div>

<script src="baicai.js"></script>
<script src="sensitive-filter.js"></script>
</body>
</html>
